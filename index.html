<!--This is a code that takes two inputs and uses JS function to calculate tip amounts and bill totals-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <h1>Tip Calculator</h1>
<!-- Bill and Tip form -->
    <fieldset>
        <form>
            <label for="bill">Bill Amount</label>
            <input type="number" name="bill" id="bill"><br><br>

            <label for="tips">Tip Amount</label>
            <select name="tips" id="tips">Tip amount
                <option value="0.15">15%</option>
                <option value="0.18">18%</option>
                <option value="0.20">20%</option>
            </select><br><br>

            <button type="button" id="calculate" onclick="calculateTip()">Calculate and Save</button>


        </form>

    <p id="outPut"></p><br><br>
    </fieldset>
    <fieldset>
    <p>Running Shift Total:</p>
    <p id="RunTotal"> $0 </p>

    <!--this is the P tag to be used by the database to display content-->
    <p id="SavedTotal">Connect Supabase to load the saved total.</p>
    </fieldset>

    <!-- Supabase's browser library. GitHub Pages can load this directly. -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        let aRunning = [];

        // Find both values in your Supabase project under Connect or Settings > API Keys.
        // A publishable key is safe to include in browser code. Never put a secret key here.
        const SUPABASE_URL = "https://nlahsehmzruthepvdpho.supabase.co";
        const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uhk_3pmOXVWmGwSMxqTChw_JN_uxweG";

        const isSupabaseConfigured =
            SUPABASE_URL.startsWith("https://") &&
            !SUPABASE_URL.includes("PASTE_YOUR") &&
            !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_YOUR");

        const supabaseClient = isSupabaseConfigured
            ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
            : null;

        //variable declerations
        let fBill = document.getElementById("bill");
        let fTip = document.getElementById("tips");
        let calculateButton = document.getElementById("calculate");
        let savedTotal = document.getElementById("SavedTotal");

        // Runs the database function whose SQL is:
        // select coalesce(sum(total_bill), 0) from public.calculator;
        async function loadSavedTotal()
        {
            if (!supabaseClient)
            {
                savedTotal.textContent = "Connect Supabase to load the saved total.";
                return;
            }

            savedTotal.textContent = "Loading saved total...";

            const { data, error } = await supabaseClient.rpc("get_saved_total");

            if (error)
            {
                console.error("Could not load the saved total:", error);
                savedTotal.textContent = "Could not load saved total. Check the console.";
                return;
            }

            const total = Number(data ?? 0);
            savedTotal.textContent = "$" + total.toFixed(2);
        }

        async function saveCalculation(billInput, tipPercent, totalBill)
        {
            if (!supabaseClient)
            {
                throw new Error("Add your Supabase URL and publishable key first.");
            }

            const { error } = await supabaseClient
                .from("calculator")
                .insert({
                    bill_input: billInput,
                    tip_pct: tipPercent,
                    total_bill: totalBill
                });

            if (error)
            {
                throw error;
            }
        }

        //functions
        //Uses form input to calculate tip and bill totals
        async function calculateTip()
        {
            let fB = parseFloat(fBill.value);
            let fT = parseFloat(fTip.value);
            let fTprc = fT * 100;
            
            if (fB > 0)
            {
                let fBillTotal = fB + (fB * fT);
                let fTipTotal = fB * fT;

                let sOutPut = "At the chosen tip amount of " + fTprc + "% Tip amount is $" + fTipTotal.toFixed(2) + ", total bill is $" + fBillTotal.toFixed(2);
                let sRunTotal = 0;

                document.getElementById("outPut").textContent = sOutPut;

                aRunning.push(fBillTotal);

                aRunning.forEach(bill => {
                    
                    sRunTotal += bill
                    
                });

                document.getElementById("RunTotal").textContent = "$" + sRunTotal.toFixed(2);

                calculateButton.disabled = true;
                savedTotal.textContent = "Saving...";

                try
                {
                    await saveCalculation(fB, fTprc, fBillTotal);
                    document.getElementById("bill").value = "";
                    await loadSavedTotal();
                }
                catch (error)
                {
                    console.error("Could not save the calculation:", error);
                    savedTotal.textContent = "Could not save. Check the console.";
                }
                finally
                {
                    calculateButton.disabled = false;
                }
            }
            else
            {
                document.getElementById("outPut").textContent = "Bill input not valid";
            }

        }

        // The database total is loaded every time the page opens or refreshes.
        loadSavedTotal();

    </script>
</body>
</html>
